<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>No Fishing No Life</title>
<style>
/* 复古像素样式子集，灵感来自 NES.css（https://github.com/nostalgic-css/NES.css，MIT） */
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body { font-family: "Microsoft YaHei", "PingFang SC", system-ui, sans-serif; }

body.theme-retro {
  --bg: #1b2432; --panel: #27314a; --panel2: #202a40; --ink: #e9edf6;
  --muted: #9aa7c0; --primary: #209cee; --success: #92cc41;
  --warning: #f7d51d; --error: #e76e55; --line: #0f1522; --shadow: #0d1220;
}
body.theme-fresh {
  --bg: #eef7f4; --panel: #ffffff; --panel2: #f2faf8; --ink: #1f3a33;
  --muted: #5f7d75; --primary: #2f9e8f; --success: #43a047;
  --warning: #f0a53a; --error: #e05c4f; --line: #cfe6e0; --shadow: #c2ddd5;
}
body.fs-small { font-size: 13px; }
body.fs-medium { font-size: 15px; }
body.fs-large { font-size: 18px; }

.app { max-width: 480px; margin: 0 auto; min-height: 100vh; display: flex; flex-direction: column; background: var(--bg); color: var(--ink); position: relative; }
.view { display: none; flex-direction: column; min-height: 100vh; }
.view.active { display: flex; }

.nes-btn {
  display: inline-block; min-height: 44px; padding: 10px 18px; border: 3px solid var(--ink);
  background: var(--panel2); color: var(--ink); font-size: inherit; cursor: pointer;
  user-select: none; text-align: center; box-shadow: 0 5px 0 0 var(--shadow); line-height: 1.3;
}
.nes-btn.small { min-height: 34px; padding: 4px 10px; box-shadow: 0 3px 0 0 var(--shadow); }
.nes-btn:active { transform: translateY(4px); box-shadow: 0 1px 0 0 var(--shadow); }
.nes-btn.small:active { transform: translateY(2px); box-shadow: 0 1px 0 0 var(--shadow); }
.nes-btn:disabled { opacity: .45; cursor: not-allowed; transform: none; box-shadow: 0 5px 0 0 var(--shadow); }
.nes-btn.is-primary { background: var(--primary); }
.nes-btn.is-success { background: var(--success); color: #1f2d3d; }
.nes-btn.is-warning { background: var(--warning); color: #1f2d3d; }
.nes-btn.is-error { background: var(--error); }

.panel { background: var(--panel); border: 3px solid var(--ink); box-shadow: 0 5px 0 0 var(--shadow); }

/* ---------- 主菜单 ---------- */
.menu-wrap { margin: auto; width: 100%; padding: 24px 20px; text-align: center; }
.game-title { font-size: 2em; letter-spacing: 2px; margin-bottom: 6px; }
.game-sub { color: var(--muted); margin-bottom: 24px; }
.menu-btns { display: flex; flex-direction: column; gap: 12px; max-width: 300px; margin: 0 auto; }
.menu-tip { margin-top: 18px; color: var(--muted); font-size: .9em; }

/* ---------- 建号 ---------- */
.join-wrap { margin: auto; width: 100%; padding: 20px; }
.join-title { font-size: 1.1em; margin: 14px 0 8px; }
.join-title:first-child { margin-top: 0; }
#join-nick { width: 100%; padding: 10px; font-size: 1em; background: var(--panel2); color: var(--ink); border: 3px solid var(--ink); }
.slider-row { display: flex; align-items: center; gap: 8px; margin: 8px 0; }
.slider-row .s-name { width: 54px; font-weight: bold; }
.slider-row input[type=range] { flex: 1; accent-color: var(--primary); min-height: 24px; }
.slider-row .s-val { width: 40px; text-align: right; font-weight: bold; }
.slider-row .s-cost { width: 58px; text-align: right; color: var(--muted); font-size: .85em; }
.join-left { color: var(--success); font-weight: bold; }
.join-left.over { color: var(--error); }
.join-btns { display: flex; gap: 10px; margin-top: 16px; flex-wrap: wrap; }
.join-back { margin-top: 12px; }

/* ---------- 游戏主界面 ---------- */
.game-header { display: flex; justify-content: space-between; align-items: center; padding: 10px 12px; background: var(--panel); border-bottom: 3px solid var(--ink); }
.game-main { flex: 1; display: flex; flex-direction: column; padding: 12px; gap: 10px; overflow-y: auto; }
.log-box { flex: 0 0 auto; background: var(--panel); border: 3px solid var(--ink); box-shadow: 0 5px 0 0 var(--shadow); padding: 8px; }
.log-list { list-style: none; height: 190px; overflow-y: auto; }
.log-list li { padding: 3px 2px; border-bottom: 1px dashed var(--line); font-size: .92em; }

.fish-area { display: flex; align-items: center; gap: 10px; }
.fish-area .fish-main { flex: 1; text-align: center; }
.fish-area .bait-btn { flex: 0 0 auto; min-width: 110px; }
.progress-wrap { display: none; }
.progress-wrap.show { display: block; }
.progress { height: 16px; border: 3px solid var(--ink); background: var(--panel2); }
.progress-fill { height: 100%; width: 0%; background: var(--success); }
.progress-info { text-align: center; font-size: .85em; color: var(--muted); margin-top: 4px; min-height: 1.2em; }

.tab-content { display: flex; flex-direction: column; gap: 10px; }
.tab-panel { display: none; }
.tab-panel.active { display: block; }
.section-title { font-weight: bold; margin: 6px 0 6px; padding-bottom: 4px; border-bottom: 2px solid var(--line); }
.stub-item { display: flex; justify-content: space-between; gap: 8px; padding: 6px 2px; border-bottom: 1px dashed var(--line); font-size: .9em; }
.stub-item .tag { color: var(--muted); white-space: nowrap; }
.stub-item .opts { display: flex; gap: 6px; align-items: center; }
.info-dot { position: relative; display: inline-block; width: 18px; height: 18px; line-height: 13px; border: 2px solid var(--muted); border-radius: 50%; text-align: center; font-size: 12px; color: var(--muted); cursor: help; flex: 0 0 auto; margin-left: 6px; }
.info-dot::after { content: attr(data-tip); position: absolute; left: 50%; bottom: calc(100% + 6px); transform: translateX(-50%); background: var(--panel2); color: var(--ink); border: 2px solid var(--ink); box-shadow: 0 4px 0 0 var(--shadow); padding: 6px 8px; font-size: 12px; line-height: 1.5; white-space: nowrap; max-width: 260px; z-index: 60; display: none; }
.info-dot:hover::after { display: block; }
.me-sub { display: flex; justify-content: space-between; align-items: center; gap: 8px; font-weight: bold; margin-top: 10px; padding-top: 6px; border-top: 2px dashed var(--line); }
.ach-line { font-size: .85em; color: var(--muted); margin-top: 4px; line-height: 1.7; }
button { touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
input.code-input { width: 100%; padding: 10px; font-size: 1em; background: var(--panel2); color: var(--ink); border: 3px solid var(--ink); }
.stub-item .desc { color: var(--muted); font-size: .85em; }

.player-card { background: var(--panel); border: 3px solid var(--ink); box-shadow: 0 5px 0 0 var(--shadow); padding: 10px; }
.player-card h3 { margin-bottom: 6px; }
.info-row { display: flex; justify-content: space-between; padding: 3px 0; border-bottom: 1px dashed var(--line); font-size: .92em; }
.info-row .k { color: var(--muted); }
.me-actions { display: flex; flex-direction: column; gap: 10px; margin-top: 12px; }

.tabbar { display: flex; border-top: 3px solid var(--ink); background: var(--panel); }
.tabbar button { flex: 1; min-height: 46px; border: none; border-right: 2px solid var(--ink); background: var(--panel2); color: var(--ink); font-size: inherit; cursor: pointer; }
.tabbar button:last-child { border-right: none; }
.tabbar button.active { background: var(--success); color: #1f2d3d; font-weight: bold; }

/* ---------- 模态与提示 ---------- */
.modal-mask { position: fixed; inset: 0; background: rgba(0,0,0,.55); display: none; align-items: center; justify-content: center; z-index: 50; padding: 16px; }
.modal-mask.open { display: flex; }
.modal-box { width: 100%; max-width: 420px; background: var(--panel); border: 3px solid var(--ink); box-shadow: 0 8px 0 0 var(--shadow); padding: 16px; color: var(--ink); max-height: 82vh; overflow-y: auto; }
.modal-title { font-weight: bold; margin-bottom: 10px; border-bottom: 2px solid var(--line); padding-bottom: 6px; }
.modal-actions { display: flex; gap: 10px; justify-content: flex-end; margin-top: 14px; flex-wrap: wrap; }
textarea.save-area { width: 100%; min-height: 130px; background: var(--panel2); color: var(--ink); border: 2px solid var(--ink); font-family: Consolas, monospace; font-size: 12px; padding: 8px; }
.setting-line { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 8px 0; border-bottom: 1px dashed var(--line); }
.setting-line .opts { display: flex; gap: 6px; flex-wrap: wrap; }
.setting-line label { display: inline-flex; align-items: center; gap: 4px; cursor: pointer; }
.setting-line input[type=radio], .setting-line input[type=checkbox] { accent-color: var(--primary); width: 18px; height: 18px; }

#toast { position: fixed; top: 14px; left: 50%; transform: translateX(-50%); background: var(--panel); color: var(--ink); border: 3px solid var(--ink); box-shadow: 0 5px 0 0 var(--shadow); padding: 8px 16px; z-index: 99; display: none; max-width: 90vw; }
#toast.show { display: block; }
.hidden { display: none !important; }
.guide-view { position: relative; }
.guide-skip { position: absolute; top: 10px; right: 10px; z-index: 5; }
.guide-wrap { margin: auto; width: 100%; padding: 26px 18px; cursor: pointer; }
.guide-title { font-size: 1.5em; text-align: center; margin-bottom: 6px; }
.guide-step { color: var(--muted); font-size: .85em; text-align: center; margin-bottom: 12px; }
.guide-desc { line-height: 1.9; margin-bottom: 12px; white-space: pre-line; }
.mock-panel { border: 3px solid var(--ink); background: var(--panel); box-shadow: 0 5px 0 0 var(--shadow); padding: 8px; margin-bottom: 12px; }
.mock-row { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 5px 2px; border-bottom: 1px dashed var(--line); font-size: .85em; }
.mock-chip { display: inline-block; padding: 7px 10px; border: 3px solid var(--ink); background: var(--panel2); font-size: .85em; }
.mock-chip.on { background: var(--success); color: #1f2d3d; }
.mock-tab { display: flex; border-top: 2px solid var(--ink); margin-top: 8px; }
.mock-tab span { flex: 1; padding: 8px 0; text-align: center; border-right: 2px solid var(--ink); background: var(--panel2); font-size: .85em; }
.mock-tab span:last-child { border-right: none; }
.mock-tab span.on { background: var(--success); color: #1f2d3d; font-weight: bold; }
.guide-hint { text-align: center; color: var(--muted); margin-top: 12px; font-size: .85em; }
.ach-row { display: flex; align-items: center; justify-content: space-between; gap: 6px; padding: 5px 0; border-bottom: 1px dashed var(--line); font-size: .9em; }
.ach-row .done { color: var(--success); }
.ach-row .todo { color: var(--muted); }
.weight-row { display: flex; justify-content: space-between; font-size: .85em; color: var(--muted); padding: 2px 0; }
</style>
</head>
<body class="theme-retro fs-medium">
<div class="app" id="app">

  <!-- 主菜单 -->
  <div class="view" id="view-menu">

      </div>
      <button class="nes-btn is-error join-back" id="btn-join-back">返回主菜单</button>
    </div>
  </div>

  <!-- 游戏主界面 -->
  <div class="view" id="view-game">
    <div class="game-header">
      <button class="nes-btn small" id="btn-me">我的</button>
      <span>钱包：<b id="gold-display">0</b></span>
    </div>
    <div class="game-main">
      <div class="log-box"><ul class="log-list" id="log-list"></ul></div>

      <div class="fish-area">

      </div>
      <div class="progress-wrap" id="progress-wrap">
        <div class="progress"><div class="progress-fill" id="progress-fill"></div></div>
        <div class="progress-info" id="progress-info"></div>
      </div>

      <div class="tab-content">
        <div class="tab-panel active" id="tab-fish">
          <div class="section-title" data-plain="钓鱼信息">钓鱼信息</div>
          <div id="fish-info"></div>
        </div>
        <div class="tab-panel" id="tab-work">
          <div class="section-title">工作系统</div>
          <div id="work-list"></div>
        </div>
        <div class="tab-panel" id="tab-shop">
          <div class="section-title" data-plain="钓鱼商店">钓鱼商店</div>
          <div id="shop-fish"></div>
          <div class="section-title">黑市商店</div>
          <div id="shop-black"></div>
        </div>
        <div class="tab-panel" id="tab-me">
          <div class="player-card" id="player-card"></div>
          <div class="me-actions">
            <button class="nes-btn" id="btn-settings">设置</button>
            <button class="nes-btn" id="btn-save">手动存档</button>
            <button class="nes-btn" id="btn-export">导出存档</button>
            <button class="nes-btn" id="btn-import">导入存档</button>
            <button class="nes-btn is-error" id="btn-reset">重置存档</button>
            <button class="nes-btn is-warning" id="btn-back-menu">返回主菜单</button>
          </div>
        </div>
      </div>
    </div>
    <div class="tabbar">

      <button id="tab-btn-shop">商店</button>
      <button id="tab-btn-me">我的</button>
    </div>
  </div>
</div>

<!-- 通用模态 -->
<div class="modal-mask" id="modal">
  <div class="modal-box">
    <div class="modal-title" id="modal-title"></div>
    <div id="modal-body"></div>
    <div class="modal-actions" id="modal-actions"></div>
  </div>
</div>
<div id="toast"></div>

  function esc(s) {

  function loadSettings() {
    try {
      var s = JSON.parse(localStorage.getItem(SETTINGS_KEY) || "null");

    } catch (e) { return defaultSettings(); }
  }

    try { localStorage.setItem(SETTINGS_KEY, JSON.stringify(settings)); } catch (e) {}
  }
  function tangle(s) {
    if (!settings.tangle) return s;
    s = s.split("饵钓").join("\u0001");
    s = s.split("钓").join("摸");
    s = s.split("\u0001").join("饵钓");
    return s;
  }
  function applyTangleStatic() {
    var els = document.querySelectorAll("[data-plain]");
    for (var i = 0; i < els.length; i++) {
      els[i].textContent = tangle(els[i].getAttribute("data-plain"));

  // ================= 存档 =================
  function freshSave(nick, attrs) {
    return {
      version: 1,
      player: { nickname: nick || "钓客", createdAt: Date.now(), attrs: attrs },
      gold: 100,
      stats: { workCount: 0, fishCount: 0, signDays: 0, boxOpen: 0, container: 0, explore: 0, fishSpend: 0, workPerJob: {} },
      bag: { box: 0, magicBox: 0, container: 0 },
      fishing: { rod: 0, baits: { "小鱼": 0, "大米": 0, "棒棒糖": 0 }, activeBait: null, blessings: { "饵钓": 0, "海之眷顾": 0 }, codex: [], countByRarity: {} },
      timers: { lastWork: 0, lastLive: 0, liveBroken: false, signDate: "", fishCooldownUntil: 0, hook: null },
      achievements: []
    };
  }
  function persist() {
    if (!save) return;
    try { localStorage.setItem(SAVE_KEY, JSON.stringify(save)); } catch (e) {}
  }
  function autosave() { if (settings.autoSave) persist(); }
  function loadSave() {
    try {
      var raw = localStorage.getItem(SAVE_KEY);
      if (!raw) return null;
      var s = JSON.parse(raw);
      return normalizeSave(s);
    } catch (e) { return null; }
  }
  function clearSave() {
    try { localStorage.removeItem(SAVE_KEY); } catch (e) {}
    save = null;
  }
  function normalizeSave(s) {
    if (!s || !s.player || !s.player.attrs) return null;
    var t = s.timers || {};
    s.player.nickname = s.player.nickname || "钓客";
    s.player.createdAt = s.player.createdAt || Date.now();
    s.gold = Math.round(typeof s.gold === "number" ? s.gold : 100);
    s.stats = Object.assign({ workCount: 0, fishCount: 0, signDays: 0, boxOpen: 0, container: 0, explore: 0, fishSpend: 0, workPerJob: {} }, s.stats || {});
    s.bag = Object.assign({ box: 0, magicBox: 0, container: 0 }, s.bag || {});
    s.fishing = Object.assign({ rod: 0, baits: { "小鱼": 0, "大米": 0, "棒棒糖": 0 }, activeBait: null, blessings: { "饵钓": 0, "海之眷顾": 0 }, codex: [], countByRarity: {} }, s.fishing || {});
    if (!(s.fishing.activeBait in s.fishing.baits) || s.fishing.baits[s.fishing.activeBait] <= 0) s.fishing.activeBait = null;
    s.timers = {
      lastWork: typeof t.lastWork === "number" ? t.lastWork : 0,
      lastLive: t.lastLive || 0,
      liveBroken: !!t.liveBroken,
      signDate: t.signDate || "",
      fishCooldownUntil: t.fishCooldownUntil || 0,
      hook: t.hook || null
    };
    s.achievements = s.achievements || [];
    return s;
  }

  // ================= 两步建号（滑块加点） =================
  function resetJoin() {
    joinVals = {};
    for (var i = 0; i < ATTRS.length; i++) joinVals[ATTRS[i]] = BASE;
  }
  function costOf(a) { return (joinVals[a] - BASE) * RATE[a]; }
  function totalCost() {
    var t = 0;
    for (var i = 0; i < ATTRS.length; i++) t += costOf(ATTRS[i]);
    return t;
  }
  function clampAttr(a) {
    var others = FREE - totalCost() + costOf(a);
    var maxInc = Math.floor(others / RATE[a]);
    maxInc -= maxInc % STEP[a];
    var maxV = BASE + maxInc;
    if (maxV > CAP) maxV = CAP - ((CAP - BASE) % STEP[a] || 0);
    if (joinVals[a] > maxV) joinVals[a] = maxV;
    if (joinVals[a] < BASE) joinVals[a] = BASE;
  }
  function renderJoin() {
    var left = FREE - totalCost();
    var el = $("join-left");
    el.textContent = left;
    el.classList.toggle("over", left < 0);
    for (var i = 0; i < ATTRS.length; i++) {
      var a = ATTRS[i];
      var row = $("slider-" + a);
      if (!row) continue;
      row.querySelector(".s-val").textContent = joinVals[a];
      row.querySelector(".s-cost").textContent = "+" + costOf(a) + " 点";
      row.querySelector("input").value = joinVals[a];
    }
  }
  function buildSliders() {
    var box = $("join-sliders");
    box.innerHTML = "";
    for (var i = 0; i < ATTRS.length; i++) {
      var a = ATTRS[i];
      var row = document.createElement("div");
      row.className = "slider-row";
      row.id = "slider-" + a;
      var name = document.createElement("span");
      name.className = "s-name";
      name.textContent = ATTR_NAMES[a];
      var input = document.createElement("input");
      input.type = "range";
      input.min = BASE;
      input.max = CAP;
      input.step = STEP[a];
      input.value = BASE;
      input.addEventListener("input", function (ev) {
        joinVals[ev.target.dataset.a] = parseInt(ev.target.value, 10);
        clampAttr(ev.target.dataset.a);
        renderJoin();
      });
      input.dataset.a = a;
      var val = document.createElement("span");
      val.className = "s-val";
      val.textContent = BASE;
      var cost = document.createElement("span");
      cost.className = "s-cost";
      cost.textContent = "+0 点";
      row.appendChild(name);
      row.appendChild(input);
      row.appendChild(val);
      row.appendChild(cost);
      box.appendChild(row);
    }
  }
  function randomJoin() {
    resetJoin();
    var guard = 0;
    while (guard++ < 2000) {
      var left = FREE - totalCost();
      if (left <= 0) break;
      var cands = [];
      for (var i = 0; i < ATTRS.length; i++) {
        var a = ATTRS[i];
        if (joinVals[a] + STEP[a] <= CAP && RATE[a] <= left) cands.push(a);
      }
      if (!cands.length) break;
      var pick = cands[Math.floor(Math.random() * cands.length)];
      joinVals[pick] += STEP[pick];
    }
    renderJoin();
  }
  function confirmJoin() {
    if (totalCost() > FREE) { showToast("自由点超出上限 220"); return; }
    var attrs = {};
    for (var i = 0; i < ATTRS.length; i++) attrs[ATTRS[i]] = joinVals[ATTRS[i]];
    var nick = $("join-nick").value.trim();
    save = freshSave(nick, attrs);
    save.achievements.push("A01");
    persist();
    goGame();
    addLog("欢迎，" + save.player.nickname + "！建号成功，初始金币 100。");
    addLog("成就解锁：A01 初来乍到。");
  }

  function renderCatchOdds(box) {
    if (!save) return;
    var w = effectiveWeights();
    var total = w[0] + w[1] + w[2] + w[3] + w[4] + w[5] + w[6] + w[7];
    if (total <= 0) return;
    var names = ["普通鱼类", "彩蛋鱼类", "稀有鱼类", "史诗鱼类", "传说鱼类", "黑市商品 1", "黑市商品 2", "黑市商品 3"];
    var sub = document.createElement("div");
    sub.className = "me-sub";
    sub.textContent = tangle("当前出货概率（本竿）");
    box.appendChild(sub);
    for (var i = 0; i < 8; i++) {
      if (w[i] <= 0) continue;
      var row = document.createElement("div");
      row.className = "weight-row";
      var l = document.createElement("span");
      l.textContent = names[i];
      var rv = document.createElement("span");
      rv.textContent = (w[i] / total * 100).toFixed(2) + "%";
      row.appendChild(l);
      row.appendChild(rv);
      box.appendChild(row);
      if (i === 1) {
        var egg = document.createElement("div");
        egg.className = "weight-row";
        egg.style.color = "var(--ink)";
        egg.textContent = "彩蛋细分：" + eggOddsText();
        box.appendChild(egg);
      }
    }
  }
  function eggOddsText() {
    if (!save) return "";
    var parts = [];
    var ws = [];
    var tw = 0;
    for (var i = 0; i < EGGS.length; i++) {
      var b = EGG_BASE[EGGS[i].name] || 1;
      var nm = EGGS[i].name;
      if (save.fishing.activeBait === "大米" && nm === "大傻") b += 32000;
      if (save.fishing.activeBait === "棒棒糖") {
        if (nm === "帕秋莉") b += 10;
        else b += 500;
      }
      ws.push([EGGS[i].name, b]);
      tw += b;
    }
    for (var i = 0; i < ws.length; i++) {
      parts.push(ws[i][0] + " " + (ws[i][1] / tw * 100).toFixed(2) + "%");
    }
    return parts.join("　");
  }
  function workMaxIncome(jobId) {
    if (!save) return 0;
    var A = save.player.attrs;
    if (jobId === 1) return Math.round((A["力"] + A["体"]) * 500 / 8);
    if (jobId === 2) return Math.round((A["技"] * 0.5 + A["魅"] * 0.9) * 500 / 6);
    if (jobId === 3) return Math.round((A["智"] + A["魅"]) * 500 / 8);
    if (jobId === 4) return Math.round((A["技"] + A["智"]) * 500 / 9);
    if (jobId === 5) return Math.round((A["力"] + A["体"]) * 500 / 6);
    return 15000;
  }
  function r2(x) { return Math.round(x * 100) / 100; }
  function todayStr() {
    var t = new Date();
    return t.getFullYear() + "-" + pad(t.getMonth() + 1) + "-" + pad(t.getDate());
  }
  function unlock(id) {
    if (save.achievements.indexOf(id) === -1) {
      save.achievements.push(id);
      addLog("成就解锁：" + id + " " + ACH_NAMES[id]);
    }
  }
  function gainBlackItem(idx) {
    save.bag[BM_KEYS[idx]] = (save.bag[BM_KEYS[idx]] || 0) + 1;
  }
  function workCooldownLeft() {
    var t = typeof save.timers.lastWork === "number" ? save.timers.lastWork : 0;
    return Math.max(0, t + 3600000 - Date.now());
  }
  function doSign() {
    if (!save) return;
    if (save.timers.signDate === todayStr()) { showToast("今天已签到"); return; }
    var g = d(100);
    save.gold = r2(save.gold + g);
    save.timers.signDate = todayStr();
    save.stats.signDays = (save.stats.signDays || 0) + 1;
    addLog("签到成功：金币 +" + g + "（累计 " + save.stats.signDays + " 天）。");
    checkAchievements();
    persist();
    updateTopBar();
    renderWorkPanel();
    renderMe();
  }
  function openResult(lines) {
    var box = document.createElement("div");
    for (var i = 0; i < lines.length; i++) {
      var p = document.createElement("p");
      p.textContent = tangle(lines[i]);
      p.style.padding = "3px 0";
      box.appendChild(p);
    }
    openModal("结果", box, [{ label: "确定", cls: "is-primary", fn: closeModal }]);
  }
  function doWork(jobId) {
    if (!save) return;
    var now = Date.now();
    var lastWorkAt = typeof save.timers.lastWork === "number" ? save.timers.lastWork : 0;
    if (now < lastWorkAt + 3600000) { showToast("工作冷却中（所有工作共用）"); return; }
    var A = save.player.attrs;
    var lines = [];
    var income = 0;
    if (jobId === 1) {
      income = (A["力"] + A["体"]) * d(500) / 8;
      var n = (save.stats.workPerJob[1] || 0) + 1;
      var bonus = 1 + 0.25 * (1 - Math.exp(-n / 15));
      if (bonus > 1.25) bonus = 1.25;
      income *= bonus;
      lines.push("搬砖第 " + n + " 次，累计加成 x" + bonus.toFixed(2));
    } else if (jobId === 2) {
      income = (A["技"] * 0.5 + A["魅"] * 0.9) * d(500) / 6;
      if (d(200) < A["魅"]) {
        var wi = d(3) - 1;
        gainBlackItem(wi);
        lines.push("魅力检定通过，顾客打赏：" + BM_NAMES[wi] + "（已存入黑市商店，商店页可查看/使用）");
      } else {
        lines.push("魅力检定未通过，无额外奖励");
      }
    } else if (jobId === 3) {
      income = (A["智"] + A["魅"]) * d(500) / 8;
      var chain = save.timers.lastLive > 0 && (now - save.timers.lastLive) <= 7200000 && !save.timers.liveBroken;
      if (chain) { income *= 1.3; lines.push("连播加成 x1.3"); }
      else { lines.push("未连播（x1）"); }
      save.timers.lastLive = now;
      save.timers.liveBroken = false;
    } else if (jobId === 4) {
      income = (A["技"] + A["智"]) * d(500) / 9;
      if (d(100) < A["意"]) { income *= 1.3; lines.push("意志检定通过 x1.3（文思泉涌）"); }
      else { lines.push("意志检定未通过"); }
    } else if (jobId === 5) {
      income = (A["力"] + A["体"]) * d(500) / 6;
      if (d(100) < A["力"]) { income *= 1.5; lines.push("力量检定通过 x1.5"); }
      else { income *= 0.5; lines.push("力量检定失败 x0.5"); }
    } else if (jobId === 6) {
      var dd = d(100);
      income = Math.max(0, (dd - 50)) * 300;
      save.stats.explore = (save.stats.explore || 0) + 1;
      lines.push("探险骰 " + dd + "，基础收益 " + income);
      if (d(10) <= 3) {
        var br = d(10);
        if (br <= 3) {
          var ai = d(6) - 1;
          var an = ATTRS[ai];
          var gain = r2(d(100) / 20);
          A[an] = r2((A[an] || 0) + gain);
          lines.push("奇遇：属性 " + ATTR_NAMES[an] + " +" + gain + "（属性无上限）");
        } else if (br <= 6) {
          var wi2 = d(3) - 1;
          gainBlackItem(wi2);
          lines.push("事件：获得黑市商品 " + BM_NAMES[wi2] + "（已存入黑市商店）");
        } else if (br <= 9) {
          var bonus2 = d(1000);
          income += bonus2;
          lines.push("事件：金钱彩蛋 +" + bonus2);
        } else {
          var jackpot = d(5000);
          income += jackpot;
          var wi3 = d(3) - 1;
          gainBlackItem(wi3);
          lines.push("稀有奇遇：金钱 +" + jackpot + " 且获得 " + BM_NAMES[wi3] + "（已存入黑市商店）");
        }
      }
    }
    income = Math.round(income);

  // ================= 钓鱼（M2 正式流程） =================
  function fishPrice(rarity, egg) {
    if (rarity === "彩蛋") return egg.price;
    if (rarity === "普通") return d(100);
    if (rarity === "稀有") return d(200) + 100;
    if (rarity === "史诗") return d(500) + 200;
    if (rarity === "传说") return d(1000) + 500;
    return 0;
  }
  function effectiveWeights() {
    var w = (WEIGHTS[save.fishing.rod] || WEIGHTS[0]).slice();
    var hz = save.fishing.blessings["海之眷顾"] || 0;
    if (hz > 0) {
      w[0] = Math.max(0, w[0] - 1000 * hz); // 普通 -1000/级
      w[1] = w[1] + 30 * hz;               // 彩蛋 +30/级
    }
    if (save.fishing.activeBait === "小鱼") w[0] = 0;         // 小鱼：移除普通鱼
    if (save.fishing.activeBait === "大米") w[1] += 32000;     // 大米：大傻 +32000
    if (save.fishing.activeBait === "棒棒糖") w[1] += 1510;    // 棒棒糖：帕秋莉+10、其余彩蛋+500
    return w;
  }
  function pickEgg() {
    var w = [], names = [];
    for (var i = 0; i < EGGS.length; i++) {
      var base = EGG_BASE[EGGS[i].name] || 1;
      var nm = EGGS[i].name;
      if (save.fishing.activeBait === "大米" && nm === "大傻") base += 32000;
      if (save.fishing.activeBait === "棒棒糖") {
        if (nm === "帕秋莉") base += 10;
        else base += 500;
      }
      names.push(nm);
      w.push(base);
    }
    var total = w[0] + w[1] + w[2] + w[3];
    var r = Math.floor(Math.random() * total);
    var acc = 0;
    for (var i = 0; i < 4; i++) { acc += w[i]; if (r < acc) return i; }
    return 0;
  }
  function pickCatchKind() {
    var w = effectiveWeights();
    var total = w[0] + w[1] + w[2] + w[3] + w[4] + w[5] + w[6] + w[7];
    var r = Math.floor(Math.random() * total);
    var acc = 0;
    for (var i = 0; i < w.length; i++) {
      acc += w[i];
      if (r < acc) return i;
    }
    return 0;
  }
  function addCodex(name) {
    if (save.fishing.codex.indexOf(name) === -1) save.fishing.codex.push(name);
  }
  function codexCount(rarity) {
    var c = 0;
    for (var i = 0; i < save.fishing.codex.length; i++) {
      if (FISH[rarity].indexOf(save.fishing.codex[i]) !== -1) c++;
    }
    return c;
  }
  function eggCount() {
    var c = 0;
    for (var i = 0; i < save.fishing.codex.length; i++) {
      if (EGG_ALL.indexOf(save.fishing.codex[i]) !== -1) c++;
    }
    return c;
  }
  function planCatch() {
    var kind = pickCatchKind();
    var plan = { kind: kind };
    if (kind >= 5 && kind <= 7) {
      plan.bmIdx = kind - 5;
    } else if (kind === 1) {
      plan.egg = EGGS[pickEgg()];
    } else {
      plan.rarity = kind === 0 ? "普通" : (kind === 2 ? "稀有" : (kind === 3 ? "史诗" : "传说"));
      plan.fish = FISH[plan.rarity][Math.floor(Math.random() * FISH[plan.rarity].length)];
    }
    return plan;
  }
  // 上钩时间按稀有度递增：普通16s 稀有17s 史诗18s 传说19s 彩蛋20s 黑市21s
  function hookMsFor(plan) {
    if (plan.kind >= 5 && plan.kind <= 7) return 21000;
    if (plan.kind === 1) return 20000;
    if (plan.rarity === "普通") return 16000;
    if (plan.rarity === "稀有") return 17000;
    if (plan.rarity === "史诗") return 18000;
    return 19000; // 传说
  }
  function doFish() {
    if (!save) { showToast("请先建号"); return; }
    var now = Date.now();
    if (save.timers.hook) return;
    if (now < (save.timers.fishCooldownUntil || 0)) return;
    var plan = planCatch();
    var baitName = save.fishing.activeBait;
    if (baitName && (save.fishing.baits[baitName] || 0) > 0) {
      save.fishing.baits[baitName]--;
      if (save.fishing.baits[baitName] <= 0) save.fishing.activeBait = null;
    }
    var reduce = (save.fishing.blessings["饵钓"] || 0) * 5000;
    var wait = Math.max(1000, hookMsFor(plan) - reduce);
    save.timers.hook = { startedAt: now, finishAt: now + wait, plan: plan };
    addLog(baitName ? "正在钓鱼……（消耗鱼饵：" + baitName + "）" : "正在钓鱼……");
    persist();
    refreshFishButton();
    refreshBaitButton();
  }
  function resolveHook() {
    if (!save || !save.timers.hook) return;
    var hk = save.timers.hook;
    var caughtAt = hk.finishAt || Date.now();
    save.timers.hook = null;
    var plan = hk.plan || planCatch();
    var msg = "";
    if (plan.kind >= 5 && plan.kind <= 7) {
      save.bag[BM_KEYS[plan.bmIdx]] = (save.bag[BM_KEYS[plan.bmIdx]] || 0) + 1;
      msg = "你钓到了一个黑市商品：" + BM_NAMES[plan.bmIdx] + "（已存入黑市商店，商店页可查看/使用）";
    } else if (plan.kind === 1) {
      addCodex(plan.egg.name);
      save.gold += plan.egg.price;
      msg = "你钓到了一条彩蛋鱼 " + plan.egg.name + "，售出 +" + plan.egg.price + " 金币";
    } else {
      var price = fishPrice(plan.rarity);
      addCodex(plan.fish);
      save.gold += price;
      msg = "你钓到了一条" + plan.rarity + "鱼 " + plan.fish + "，售出 +" + price + " 金币";
    }
    save.stats.fishCount = (save.stats.fishCount || 0) + 1;
    save.timers.fishCooldownUntil = caughtAt + 10000;
    addLog(msg);
    checkAchievements();
    persist();
    updateTopBar();
    renderFishInfo();
    renderShopStub();
    renderMe();
    refreshFishButton();
  }
  function openBaitMenu() {
    if (!save) { showToast("请先建号"); return; }
    var box = document.createElement("div");
    var items = [{ name: "无" }];
    for (var i = 0; i < BAITS.length; i++) {

  function setBait(name) {
    if (!save) return;
    save.fishing.activeBait = name === "无" ? null : name;
    addLog(name === "无" ? "当前鱼饵：无" : "当前鱼饵：" + name + "（剩余 " + save.fishing.baits[name] + "）");

  function refreshBaitButton() {
    var btn = $("btn-bait");
    if (!save) { btn.textContent = "鱼饵：无"; return; }
    if (save.fishing.activeBait) {
      btn.textContent = "鱼饵：" + save.fishing.activeBait + "×" + (save.fishing.baits[save.fishing.activeBait] || 0);

  function refreshFishButton() {
    var btn = $("btn-fish");
    var wrap = $("progress-wrap");
    var fill = $("progress-fill");
    var st = $("fish-state");
    if (!save) {
      btn.disabled = true;
      btn.textContent = "钓鱼";
      wrap.classList.remove("show");
      if (st) st.textContent = "空闲";
      return;
    }
    var now = Date.now();
    var info = $("progress-info");
    if (save.timers.hook) {
      var total = Math.max(1, save.timers.hook.finishAt - save.timers.hook.startedAt);
      var left = Math.max(0, save.timers.hook.finishAt - now);
      var pct = Math.max(0, Math.min(100, (1 - left / total) * 100));
      fill.style.width = pct.toFixed(1) + "%";
      wrap.classList.add("show");
      info.textContent = pct.toFixed(0) + "%　剩余 " + (left / 1000).toFixed(1) + " 秒";
      btn.disabled = true;
      btn.textContent = tangle("钓鱼中…");
      if (st) st.textContent = tangle("钓鱼中");
    } else if (now < (save.timers.fishCooldownUntil || 0)) {
      var sec = Math.ceil((save.timers.fishCooldownUntil - now) / 1000);
      btn.disabled = true;
      btn.textContent = "冷却 " + sec + " 秒";
      wrap.classList.remove("show");
      info.textContent = "";
      if (st) st.textContent = "冷却中";
    } else {
      btn.disabled = false;
      btn.textContent = tangle("钓鱼");
      wrap.classList.remove("show");
      fill.style.width = "0%";
      info.textContent = "";
      if (st) st.textContent = "空闲";
    }
  }
  function tick() {

  $("btn-import-menu").addEventListener("click", openImport);
  $("btn-reset-menu").addEventListener("click", openReset);
  $("btn-join-back").addEventListener("click", goMenu);
  $("btn-random").addEventListener("click", randomJoin);
  $("btn-clear").addEventListener("click", function () {
    resetJoin();
    renderJoin();
  });
  $("btn-confirm").addEventListener("click", confirmJoin);
  $("btn-me").addEventListener("click", function () { switchTab("me"); });
  $("btn-settings").addEventListener("click", openSettings);
  $("btn-save").addEventListener("click", function () {
    if (!save) return;
    persist();
    showToast("已存档");
  });
  $("btn-export").addEventListener("click", openExport);
  $("btn-import").addEventListener("click", openImport);
  $("btn-reset").addEventListener("click", openReset);
  $("btn-back-menu").addEventListener("click", function () {
    openConfirm("返回主菜单？当前进度会自动保存。", function () {
      persist();
      goMenu();
    });
  });
  $("btn-fish").addEventListener("click", doFish);
  $("btn-bait").addEventListener("click", openBaitMenu);
  $("tab-btn-fish").addEventListener("click", function () { switchTab("fish"); });
  $("tab-btn-work").addEventListener("click", function () { switchTab("work"); });
  $("tab-btn-shop").addEventListener("click", function () { switchTab("shop"); });
  $("tab-btn-me").addEventListener("click", function () { switchTab("me"); });
  $("modal").addEventListener("click", function (ev) {
    if (ev.target === $("modal")) closeModal();
  });
  $("btn-guide-skip").addEventListener("click", function (ev) {
    ev.stopPropagation();
    goJoin();
  });
  $("view-guide").addEventListener("click", function (ev) {
    if (ev.target && ev.target.id === "btn-guide-skip") return;
    guideNext();
  });

  // ================= 启动 =================
  applySettings();
  buildSliders();
  goMenu();
})();
</script>
